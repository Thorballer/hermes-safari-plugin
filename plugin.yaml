name: safari
version: 0.1.0
description: >-
  Drive the user's real Safari on macOS. Safari has no Chrome DevTools Protocol,
  so this plugin speaks AppleScript (JXA) to Safari for tabs, navigation, DOM
  reads, and real native mouse/keyboard input. Registers a `safari` toolset and a
  `hermes safari` command that reports every macOS permission gate and the fix
  for each.
author: "Daniel Goldberg"
kind: standalone
provides_tools:
  - safari_open
  - safari_state
  - safari_js
  - safari_act
  - safari_click
  - safari_type
  - safari_tabs
  - safari_screenshot
provides_hooks:
  - on_session_end
requires_env: []
tags:
  - browser
  - safari
  - macos
  - applescript
